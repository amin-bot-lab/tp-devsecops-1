name: DevSecOps CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: democyber

    steps:
      # 1. Récupérer le code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Scanner les secrets avec Gitleaks
      - name: Run Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 3. Installer Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: democyber/pom.xml

      # 4. Compiler et tester
      - name: Build and Test
        run: mvn clean verify

      # 5. Connexion Docker Hub
      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 6. Construire et publier l'image
      - name: Docker Build
        run: docker build -t jbaliamina/democyber:latest .

      # 7. Tester l'image Docker
      - name: Test Docker image
        run: |
          docker run -d --name democyber-test -p 8080:8080 jbaliamina/democyber:latest
          sleep 10
          curl -f http://localhost:8080
          docker stop democyber-test
          docker rm democyber-test


      # Sauvegarder le rapport Gitleaks

      - name: Check Gitleaks report
        if: always()
        run: |
          find .. -name "results.sarif" -type f

      - name: Upload Gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: |
            results.sarif
            democyber/results.sarif
          if-no-files-found: warn

      # Scanner l'image Docker avec Trivy
      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: jbaliamina/democyber:latest
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
      
      # 9. Générer le rapport Trivy JSON
      - name: Generate Trivy JSON report
        if: always()
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: jbaliamina/democyber:latest
          format: 'json'
          output: 'trivy-report.json'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'


      # 10. Télécharger le rapport Trivy
      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: |
            trivy-report.json
            democyber/trivy-report.json
          if-no-files-found: error


